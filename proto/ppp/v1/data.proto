syntax = "proto3";

package ppp.v1;

import "ppp/v1/common.proto";

option go_package = "github.com/akzj/ppp/gen/ppp/v1;pppv1";

// Data is the ppp-service data plane service (node-to-node + leaf pulls).
// Cancellation is not done via hop-by-hop RPC: requests for a banned file
// are rejected directly (see common.BannedFile).
//
// Back-to-source modes (see docs/design-v2.md §3.5):
//   - pass-through: relay a child piece request upstream without storing.
//   - full-download subtask: download the whole file, cache locally, then
//     serve. Default in the machine-room scenario (all nodes need the file).
// The mode is a node/tree-local configuration, not a per-request field.
service Data {
  // Fetch a single piece by index (unary, one 4MB piece per call)
  rpc GetPiece(GetPieceRequest) returns (GetPieceResponse);
  // Full file download with progress stream (leaf SDK / leaf apps)
  rpc DownloadFile(DownloadFileRequest) returns (stream ProgressState);

  // Session subscription lease (per-child per-job, NOT per-piece).
  // Pure relay nodes use this to stop downloading early once the last
  // subscriber leaves.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);

  // Resolve the final on-disk path of a file on this node.
  rpc ResolvePath(ResolvePathRequest) returns (ResolvePathResponse);

  // File metadata (file-distribution core §5.1): GetFileInfo returns the
  // sealed artifact's info (metadata_id identifies the immutable metadata
  // bytes); GetMetadata streams those bytes. A node binds exactly one
  // metadata_id per download; GetPiece requests carry it so an upstream
  // refuses pieces whose metadata differs (CONTENT_CONFLICT).
  rpc GetFileInfo(GetFileInfoRequest) returns (GetFileInfoResponse);
  rpc GetMetadata(GetMetadataRequest) returns (stream MetadataChunk);
}

message FileInfo {
  TreeKey key = 1;
  int64 file_size = 2;
  int64 piece_size = 3;
  int64 piece_count = 4;
  bytes metadata_id = 5;    // SHA-256 of the canonical metadata bytes
  int64 metadata_size = 6;
  string digest_algorithm = 7; // e.g. "SHA-256"
}

message MetadataChunk {
  bytes metadata_id = 1;    // the metadata this chunk belongs to
  int64 offset = 2;
  bytes data = 3;
}

message GetFileInfoRequest {
  TreeKey key = 1;
}
message GetFileInfoResponse {
  oneof result {
    FileInfo info = 1;
    Error error = 2;
  }
}

message GetMetadataRequest {
  TreeKey key = 1;
  bytes metadata_id = 2;    // bind the download to this metadata_id
}

message ResolvePathRequest {
  TreeKey key = 1;
}
message ResolvePathResponse {
  string local_path = 1; // <download-path>/<basename>
  bool exist = 2;        // whether the file is currently present (complete)
}

message GetPieceRequest {
  TreeKey key = 1;
  int64 index = 2;
  int64 size = 3;            // total file size (for validation)
  // job_id follows the convention in control.proto CancelJobRequest:
  // center jobs "job:<uuid>", local back-to-source jobs "local:<uuid>".
  string job_id = 4;
  repeated Hop from = 5;     // loop-prevention path (nodeID + jobID)
  // metadata_id binds this request to the immutable metadata the downloader
  // has validated; the upstream serves the piece only when its sealed
  // artifact has the same metadata_id (else CONTENT_CONFLICT).
  bytes metadata_id = 6;
}
message Hop {
  string node_id = 1;
  string job_id = 2;
}

message GetPieceResponse {
  oneof result {
    Piece piece = 1;
    Error error = 2;
  }
}
message Error {
  ErrorCode code = 1;
  string message = 2;
  enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    BANNED = 1;              // forbidden to distribute (canceled)
    NOT_FOUND = 2;           // piece/file not found
    LOOP_DETECTED = 3;
    BAD_REQUEST = 4;
    INTERNAL = 5;
    NOT_READY = 6;           // artifact not yet sealed/publishable
    CONTENT_CONFLICT = 7;    // different metadata_id for the same filename
    METADATA_CORRUPT = 8;    // metadata bytes failed validation
    PIECE_DIGEST_MISMATCH = 9;  // piece digest differs from metadata
    FILE_DIGEST_MISMATCH = 10;  // whole-file digest differs from metadata
  }
}

message DownloadFileRequest {
  TreeKey key = 1;
  int64 size = 2;
  string job_id = 3;
  repeated Hop from = 4;
}

message SubscribeRequest {
  TreeKey key = 1;
  string job_id = 2;
  string child_node_id = 3;
  int64 lease_seconds = 4;   // requested lease duration (default 30s if 0)
}
message SubscribeResponse {
  bool accepted = 1;
  bool banned = 2;           // file is forbidden to distribute
  int64 granted_lease_seconds = 3; // actual lease granted; renew before expiry
  // Subscribe is idempotent: re-subscribing with the same (key, job_id,
  // child_node_id) renews the lease instead of creating a second one.
}

message UnsubscribeRequest {
  TreeKey key = 1;
  string job_id = 2;
  string child_node_id = 3;
}
message UnsubscribeResponse {
  bool ok = 1;
}
