syntax = "proto3";

package ppp.v1;

import "ppp/v1/common.proto";

option go_package = "github.com/akzj/ppp/gen/ppp/v1;pppv1";

// Data is the ppp-service data plane service (node-to-node + leaf pulls).
// Cancellation is not done via hop-by-hop RPC: requests for a banned file
// are rejected directly (see common.BannedFile).
//
// Back-to-source modes (see docs/design-v2.md §3.5):
//   - pass-through: relay a child piece request upstream without storing.
//   - full-download subtask: download the whole file, cache locally, then
//     serve. Default in the machine-room scenario (all nodes need the file).
// The mode is a node/tree-local configuration, not a per-request field.
service Data {
  // Fetch a single piece by index (unary, one 4MB piece per call)
  rpc GetPiece(GetPieceRequest) returns (GetPieceResponse);
  // Full file download with progress stream (leaf SDK / leaf apps)
  rpc DownloadFile(DownloadFileRequest) returns (stream ProgressState);

  // Session subscription lease (per-child per-job, NOT per-piece).
  // Pure relay nodes use this to stop downloading early once the last
  // subscriber leaves.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
}

message GetPieceRequest {
  TreeKey key = 1;
  int64 index = 2;
  int64 size = 3;            // total file size (for validation)
  string job_id = 4;         // locally or center generated
  repeated Hop from = 5;     // loop-prevention path (nodeID + jobID)
}
message Hop {
  string node_id = 1;
  string job_id = 2;
}

message GetPieceResponse {
  oneof result {
    Piece piece = 1;
    Error error = 2;
  }
}
message Error {
  ErrorCode code = 1;
  string message = 2;
  enum ErrorCode {
    ERROR_CODE_UNSPECIFIED = 0;
    BANNED = 1;              // forbidden to distribute (canceled)
    NOT_FOUND = 2;           // piece/file not found
    LOOP_DETECTED = 3;
    BAD_REQUEST = 4;
    INTERNAL = 5;
  }
}

message DownloadFileRequest {
  TreeKey key = 1;
  int64 size = 2;
  string job_id = 3;
  repeated Hop from = 4;
}

message SubscribeRequest {
  TreeKey key = 1;
  string job_id = 2;
  string child_node_id = 3;
  int64 lease_seconds = 4;   // requested lease duration (default 30s if 0)
}
message SubscribeResponse {
  bool accepted = 1;
  bool banned = 2;           // file is forbidden to distribute
  int64 granted_lease_seconds = 3; // actual lease granted; renew before expiry
  // Subscribe is idempotent: re-subscribing with the same (key, job_id,
  // child_node_id) renews the lease instead of creating a second one.
}

message UnsubscribeRequest {
  TreeKey key = 1;
  string job_id = 2;
  string child_node_id = 3;
}
message UnsubscribeResponse {
  bool ok = 1;
}
