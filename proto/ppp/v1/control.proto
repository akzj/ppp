syntax = "proto3";

package ppp.v1;

import "ppp/v1/common.proto";

option go_package = "github.com/akzj/ppp/gen/ppp/v1;pppv1";

// Control is the ppp-ctl-server public service (central control plane).
// - Nodes register/heartbeat and sync topology and the banned list here.
// - Orchestration systems create/query/cancel distribution jobs here.
service Control {
  // ===== Tree lifecycle =====
  rpc CreateTree(CreateTreeRequest) returns (CreateTreeResponse);
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  rpc ListTrees(ListTreesRequest) returns (ListTreesResponse);
  rpc DeleteTree(DeleteTreeRequest) returns (DeleteTreeResponse);

  // ===== Node onboarding =====
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Topology change push (incremental; full snapshot on reconnect)
  rpc WatchTopology(WatchTopologyRequest) returns (stream TopologyUpdate);
  // Banned list incremental push (persistent cancellation)
  rpc WatchBannedList(WatchBannedListRequest) returns (stream BannedListUpdate);
  // Full banned list sync on reconnect (with generation)
  rpc SyncBannedList(SyncBannedListRequest) returns (SyncBannedListResponse);

  // ===== Job orchestration =====
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc QueryJob(QueryJobRequest) returns (QueryJobResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // WatchJobs pushes new/updated job assignments to root nodes of a tree.
  // Root nodes subscribe and start pulling the file from Source on receipt.
  rpc WatchJobs(WatchJobsRequest) returns (stream JobUpdate);
  // Unban removes a file from the banned list (undo a wrong cancel).
  rpc Unban(UnbanRequest) returns (UnbanResponse);

  // Node progress reporting
  rpc SyncProgress(stream ProgressRecord) returns (SyncProgressResponse);
}

// ===== Tree lifecycle =====

message CreateTreeRequest {
  Tree tree = 1;
}
message CreateTreeResponse {
  Tree tree = 1;
}

message GetTreeRequest {
  string tree_id = 1;
}
message GetTreeResponse {
  Tree tree = 1;
}

message ListTreesRequest {}
message ListTreesResponse {
  repeated Tree trees = 1;
}

message DeleteTreeRequest {
  string tree_id = 1;
}
message DeleteTreeResponse {
  bool deleted = 1;
}

// ===== Node onboarding =====

message RegisterNodeRequest {
  Node node = 1;
}
message RegisterNodeResponse {
  Tree tree = 1;                 // owning tree + topology generation
  Topology topology = 2;         // initial topology (parent addrs)
  repeated BannedFile banned = 3; // initial banned list
}

message HeartbeatRequest {
  Node node = 1;
}
message HeartbeatResponse {
  int64 topology_generation = 1; // if mismatched with node, re-pull topology
  int64 banned_generation = 2;
}

message WatchTopologyRequest {
  string tree_id = 1;
  int64 from_generation = 2;
}
message TopologyUpdate {
  int64 generation = 1;
  Topology topology = 2;
}

// Topology is the per-node upstream address table within a tree.
message Topology {
  string tree_id = 1;
  int64 generation = 2;
  // node_id -> upstream (ordered; random/round-robin selection)
  map<string, NodeUpstream> node_upstreams = 3;
}
message NodeUpstream {
  repeated string addrs = 1; // parent node gRPC addrs (empty when pulling from source)
  bool pull_from_source = 2; // primary root pulls from Source directly (disambiguates empty addrs)
}

message WatchBannedListRequest {
  string tree_id = 1;
  int64 from_generation = 2;
}
message BannedListUpdate {
  int64 generation = 1;
  // When full_snapshot is true, snapshot is authoritative and added/removed
  // must be ignored. Otherwise added/removed are incremental deltas.
  bool full_snapshot = 3;
  repeated BannedFile snapshot = 4; // full banned list (valid when full_snapshot=true)
  repeated BannedFile added = 2;   // newly banned files (delta)
  repeated TreeKey removed = 5;    // unbanned files (delta)
}
message SyncBannedListRequest {
  string tree_id = 1;
  int64 from_generation = 2;
}
message SyncBannedListResponse {
  int64 generation = 1;
  repeated BannedFile banned = 2;
}

// ===== Job orchestration =====

message CreateJobRequest {
  string tree_id = 1;
  string filename = 2;
  int64 size = 3;
  string md5 = 4;
  Source source = 5;              // override tree default source (optional)
  repeated string target_node_ids = 6; // empty = whole tree
}
message CreateJobResponse {
  Job job = 1;
}

message QueryJobRequest {
  string job_id = 1;              // center jobs only: "job:<uuid>"
}
message QueryJobResponse {
  Job job = 1;
}

// job_id convention:
//   center-generated jobs: "job:<uuid>"
//   local (scale-out back-to-source) jobs: "local:<uuid>" — nodes generate locally;
//   the control plane accepts their progress without requiring a Job record.
// Cancellation key is (tree_id, filename), NOT job_id: banning a file
// cancels every center job AND every local fetch for that file in the tree.
message CancelJobRequest {
  // Either (job_id) or (tree_id + filename) must be provided.
  // - job_id only: ctl resolves the job to (tree_id, filename) and bans it.
  // - job_id + filename: job_id is recorded as BannedFile.job_id (trigger).
  // Banning (tree_id, filename) forbids that file for the whole tree: every
  // center job and every local fetch for it is stopped.
  string job_id = 1;
  string tree_id = 2;
  string filename = 3;
  string reason = 4;
}
message CancelJobResponse {
  bool canceled = 1;
  bool already_banned = 2;        // file was already on the banned list
  int32 affected_jobs = 3;        // center jobs for that file now canceled
}

message ListJobsRequest {
  string tree_id = 1;
  Job.JobState state = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message ListJobsResponse {
  repeated Job jobs = 1;
  string next_page_token = 2;
}

message WatchJobsRequest {
  string tree_id = 1;
  // On subscribe, the server first replays every active (CREATED/DISTRIBUTING)
  // job for the tree, then streams new jobs and removals. No wall-clock
  // cursor is used, so client/server clock skew cannot drop jobs.
}
message JobUpdate {
  Job job = 1;                    // full job on create/update
  bool removed = 2;               // true when the job is no longer actionable
}

message UnbanRequest {
  string tree_id = 1;
  string filename = 2;
}
message UnbanResponse {
  bool unbanned = 1;
}

message ProgressRecord {
  ProgressState state = 1;
  string node_id = 2;
}
message SyncProgressResponse {
  bool ok = 1;
}
