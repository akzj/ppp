syntax = "proto3";

package ppp.v1;

option go_package = "github.com/akzj/ppp/gen/ppp/v1;pppv1";

// ============ Tree & Topology ============

// Tree is a distribution tree. {app, env, idc} uniquely identifies a tree.
// A tree defines an independent content namespace (TreeID, Filename).
message Tree {
  string id = 1;          // globally unique: app + "/" + env + "/" + idc
  string app = 2;
  string environment = 3; // dev|beta|pre|prod
  string idc = 4;
  string cluster = 5;     // optional deployment metadata; NOT part of tree identity
  int32 root_count = 6;   // number of root nodes, 1-3 (configurable; enforced by ctl)
  int32 group_members = 7; // nodes per group (non-root layers)
  int32 group_children = 8; // child groups per group
  Source source = 9;      // source: OSS/S3/HTTP/HTTPS (roots pull from source)
  int64 generation = 10;  // topology generation, incremented on change
}

message Source {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    OSS = 1;
    S3 = 2;
    HTTP = 3;
    HTTPS = 4;
  }
  Type type = 1;
  repeated string urls = 2;
  string bucket = 3;
  string key = 4;
  string region = 5;
  map<string, string> headers = 6;
}

message Node {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROOT = 1;
    MEMBER = 2;
  }
  string id = 1;
  string addr = 2;          // gRPC address
  string tree_id = 3;       // the single tree this node belongs to
  Role role = 4;
  map<string, string> labels = 5;
  int64 last_heartbeat = 6; // unix seconds
}

// TreeKey is the content namespace key.
message TreeKey {
  string tree_id = 1;
  string filename = 2;
}

// ============ Job ============

message Job {
  enum JobState {
    JOB_STATE_UNSPECIFIED = 0;
    CREATED = 1;
    DISTRIBUTING = 2;
    SUCCESS = 3;
    FAILED = 4;
    CANCELED = 5;
  }
  string id = 1;
  string tree_id = 2;
  string filename = 3;
  int64 size = 4;
  string md5 = 5;
  Source source = 6;
  JobState state = 7;
  repeated string target_node_ids = 8; // empty = whole tree
  int64 created_at = 9;
  int64 updated_at = 10;
}

// ============ Cancellation (persistent banned distribution list) ============

// BannedFile records a file that is forbidden to distribute.
// The cancellation key is (tree_id, filename) and does NOT depend on job_id:
// whether the job was created by the control plane or locally, a hit is rejected.
message BannedFile {
  string tree_id = 1;
  string filename = 2;
  string reason = 3;
  string job_id = 4;      // job that triggered the cancel (optional for local/manual)
  int64 banned_at = 5;    // unix seconds
}

// ============ Piece ============

message PieceInfo {
  uint64 hash = 1;  // crc64/xxhash of data
  int64 index = 2;
  int32 size = 3;
  int64 offset = 4;
}

message Piece {
  PieceInfo info = 1;
  bytes data = 2;
}

// ============ Progress ============

message ProgressState {
  enum DownloadState {
    DOWNLOAD_STATE_UNSPECIFIED = 0;
    DOWNLOADING = 1;
    SUCCESS = 2;
    FAILED = 3;
    BANNED = 4; // hit the banned distribution list
  }
  string job_id = 1;
  string tree_id = 2;
  string filename = 3;
  int64 size = 4;
  int64 downloaded_bytes = 5;
  int32 progress = 6;   // 0-100
  DownloadState state = 7;
  string error = 8;
  string local_path = 9; // final on-disk path on the reporting node
}
